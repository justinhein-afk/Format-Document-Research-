[project]
name = "apa-formatter"
version = "0.1.0"
description = "Turn an unformatted research paper (.docx) into an APA 7 formatted .docx"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "lxml>=5.0",
  "anthropic>=1.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
